<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Improver</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Mammoth -->
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

    <style>
        body {
            background: #121212;
            color: white;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #333;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            background: #0d1117;
            color: #c9d1d9;
            padding: 15px;
            border-radius: 10px;
        }

        #spinner {
            display: none;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="text-center mb-4">
        <h1>🚀 AI Resume Improver</h1>
        <p class="text-secondary">
            Upload a PDF or DOCX resume and get AI feedback
        </p>
    </div>

    <div class="card p-4">

        <div class="mb-3">
            <label class="form-label">Resume File</label>
            <input
                type="file"
                id="fileInput"
                class="form-control"
                accept=".pdf,.docx">
        </div>

        <div class="mb-3">
            <label class="form-label">Target Job Description (Optional)</label>
            <textarea
                id="jobDescription"
                class="form-control"
                rows="5"
                placeholder="Paste the job description here..."></textarea>
        </div>

        <button
            class="btn btn-primary"
            onclick="processFile()">
            Analyze Resume
        </button>

        <div id="spinner" class="mt-3 alert alert-warning">
            ⏳ Analyzing Resume...
        </div>

        <hr>

        <h4>📄 Extracted Resume Text</h4>
        <pre id="resumeText">Waiting for file...</pre>

        <hr>

        <h4>🤖 AI Analysis</h4>
        <pre id="output">Results will appear here...</pre>

    </div>

</div>

<script>

const OPENROUTER_API_KEY = "YOUR_OPENROUTER_API_KEY";

async function processFile() {

    const file = document.getElementById("fileInput").files[0];

    if (!file) {
        alert("Please select a PDF or DOCX file.");
        return;
    }

    let extractedText = "";

    try {

        if (file.type === "application/pdf") {
            extractedText = await readPDF(file);
        }
        else if (file.name.toLowerCase().endsWith(".docx")) {
            extractedText = await readDOCX(file);
        }
        else {
            alert("Only PDF and DOCX files are supported.");
            return;
        }

        document.getElementById("resumeText").textContent = extractedText;

        await improveResume(extractedText);

    } catch (error) {
        console.error(error);

        document.getElementById("output").textContent =
            "Error: " + error.message;
    }
}

async function readPDF(file) {

    const buffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: buffer
    }).promise;

    let text = "";

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {

        const page = await pdf.getPage(pageNum);

        const content = await page.getTextContent();

        const strings = content.items.map(item => item.str);

        text += strings.join(" ") + "\n\n";
    }

    return text;
}

async function readDOCX(file) {

    const buffer = await file.arrayBuffer();

    const result = await mammoth.extractRawText({
        arrayBuffer: buffer
    });

    return result.value;
}

async function improveResume(resumeText) {

    document.getElementById("spinner").style.display = "block";

    const jobDescription =
        document.getElementById("jobDescription").value;

    const prompt = `
You are an expert resume reviewer.

Analyze this resume and provide:

1. Resume Score (/100)
2. Strengths
3. Weaknesses
4. Missing Skills
5. ATS Optimization Suggestions
6. Improved Experience Section
7. Improved Summary Section

Job Description:
${jobDescription}

Resume:
${resumeText}
`;

    try {

        const response = await fetch(
            "https://openrouter.ai/api/v1/chat/completionsBearer ${OPENROUTER_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "mistralai/mistral-7b-instruct:free",
                    messages: [
                        {
                            role: "user",
                            content: prompt
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        console.log(data);

        if (data.error) {
            throw new Error(data.error.message);
        }

        document.getElementById("output").textContent =
            data.choices[0].message.content;

    } catch (error) {

        document.getElementById("output").textContent =
            "AI Error: " + error.message;

    } finally {

        document.getElementById("spinner").style.display = "none";
    }
}

</script>

</body>
</html>
